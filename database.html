<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库浏览器 · learning.db | 个性化学习推荐系统</title>
<link rel="stylesheet" href="assets/style.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233e86f7'/><text x='16' y='22' font-size='16' fill='white' text-anchor='middle'>库</text></svg>">
<style>
.db-wrap{max-width:1220px;margin:0 auto;padding:28px 3.5% 70px}
.db-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.db-head h1{margin:0 0 6px;font-size:27px}
.db-head p{margin:0;color:var(--muted);font-size:13px}
.db-badge{font-size:12px;color:var(--cyan);background:var(--cyan-soft);border-radius:14px;padding:6px 12px}
.db-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow)}
.db-search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
.db-search input{border:0;background:none;outline:none;font:14px inherit;width:100%;color:var(--ink)}
.db-select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:13px inherit;color:var(--ink);background:#fff;cursor:pointer}
.db-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.db-tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 16px;font:600 13px inherit;color:var(--muted);cursor:pointer}
.db-tab .cnt{font-weight:400;font-size:11px;background:var(--paper);border-radius:10px;padding:3px 8px;color:#93a0b5}
.db-tab.active{border-color:#b8d2fb;background:var(--cyan-soft);color:var(--cyan)}
.db-tab.active .cnt{background:#fff;color:var(--cyan)}
.sql-box{background:#102a4d;color:#d9e6ff;border-radius:11px;padding:15px 18px;margin-bottom:14px;font:13px/1.7 Consolas,Menlo,monospace;white-space:pre-wrap;position:relative}
.sql-box .sql-tag{position:absolute;top:-9px;left:14px;background:var(--amber);color:#fff;font:700 10px "Microsoft YaHei",sans-serif;border-radius:8px;padding:2px 9px;letter-spacing:1px}
.sql-box .kw{color:#88d7e2}
.sql-queries{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sql-chip{border:1px solid #cfe0fb;background:#fff;color:var(--cyan);border-radius:16px;padding:7px 14px;font:600 12px inherit;cursor:pointer}
.sql-chip:hover{background:var(--cyan-soft)}
.sql-chip.active{background:var(--cyan);color:#fff}
.tbl-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tbl-scroll{max-height:560px;overflow:auto}
table.db{width:100%;border-collapse:collapse;font-size:13px}
table.db th{position:sticky;top:0;background:#f7f9fd;color:#5b6b8a;text-align:left;font-size:11px;letter-spacing:.5px;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.db td{padding:10px 13px;border-bottom:1px solid #eef2f8;vertical-align:top;max-width:340px}
table.db tr:hover td{background:#f8fbff}
td.mono,th.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:600}
.pill.ok{background:#e2f6ee;color:var(--green)}
.pill.bad{background:#fde9eb;color:var(--red)}
.pill.k{background:var(--cyan-soft);color:var(--cyan)}
.diff-bar{display:inline-block;width:52px;height:5px;border-radius:4px;background:#edf1f8;vertical-align:middle;margin-right:6px;overflow:hidden}
.diff-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#f2a93b,#e86571)}
.db-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:#fbfcfe;font-size:12px;color:var(--muted)}
.link-back{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);text-decoration:none;font-size:13px;font-weight:600}
.schema-note{font-size:12px;color:var(--muted);background:#fff;border:1px dashed #d5dfec;border-radius:10px;padding:11px 14px;margin-bottom:16px}
mark{background:#fff2c4;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<div class="db-wrap">
  <div class="db-head">
    <div>
      <h1>数据库浏览器 <span class="db-badge">learning.db · SQLite</span></h1>
      <p>后端 SQLite 数据库完整快照：题目、答题记录、知识图谱、学习者设置 — 支持全文检索、条件筛选与演示 SQL 查询</p>
    </div>
    <a class="link-back" href="index.html">← 返回学习系统</a>
  </div>

  <div class="db-toolbar">
    <div class="db-search"><span>🔍</span><input id="q" placeholder="全文检索：输入题号、标题、知识点、学生…（实时过滤当前表）"></div>
    <select class="db-select" id="f-knowledge" hidden></select>
    <select class="db-select" id="f-correct" hidden></select>
    <select class="db-select" id="f-student" hidden></select>
    <button class="button ghost" id="export-btn">导出当前结果 CSV</button>
  </div>

  <div class="db-tabs" id="tabs"></div>

  <div class="schema-note" id="schema-note"></div>

  <div class="sql-queries" id="sql-chips" hidden></div>
  <div class="sql-box" id="sql-box" hidden><span class="sql-tag">SQL</span><div id="sql-text"></div></div>

  <div class="tbl-card">
    <div class="tbl-scroll"><table class="db"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="db-foot"><span id="row-info"></span><span>数据快照导出自后端 SQLite · 只读演示</span></div>
  </div>
</div>

<script src="assets/db_data.js?v=3"></script>
<script>
(function(){
  var tables = DB.tables;
  var KNAME = {integer:"整数运算", fractions:"分数运算", equations:"一元一次方程", functions:"一次函数", geometry:"三角形面积"};
  var current = "questions";
  var filterK = "", filterC = "", filterS = "";
  var preset = null;

  // 预置演示查询
  var QUERIES = {
    questions: [
      {name:"各知识点题量与平均难度", sql:"SELECT knowledge_id, COUNT(*) AS 题量, ROUND(AVG(difficulty),3) AS 平均难度\nFROM questions GROUP BY knowledge_id;",
       run:function(){var g={};tables.questions.rows.forEach(function(r){(g[r.knowledge_id]=g[r.knowledge_id]||[]).push(r)});
         return {cols:["knowledge_id","知识点","题量","平均难度"],rows:Object.keys(g).map(function(k){return [k,KNAME[k]||k,g[k].length,(g[k].reduce(function(s,r){return s+r.difficulty},0)/g[k].length).toFixed(3)]})}}},
      {name:"难度最高的 10 道题", sql:"SELECT id, title, knowledge_id, difficulty\nFROM questions ORDER BY difficulty DESC LIMIT 10;",
       run:function(){return {cols:["id","title","knowledge_id","difficulty"],rows:tables.questions.rows.slice().sort(function(a,b){return b.difficulty-a.difficulty}).slice(0,10).map(function(r){return [r.id,r.title,r.knowledge_id,r.difficulty]})}}},
      {name:"各知识点难度区间", sql:"SELECT knowledge_id, MIN(difficulty) AS 最低, MAX(difficulty) AS 最高\nFROM questions GROUP BY knowledge_id;",
       run:function(){var g={};tables.questions.rows.forEach(function(r){var a=g[r.knowledge_id]=g[r.knowledge_id]||[r.difficulty,r.difficulty];a[0]=Math.min(a[0],r.difficulty);a[1]=Math.max(a[1],r.difficulty)});
         return {cols:["knowledge_id","知识点","最低难度","最高难度"],rows:Object.keys(g).map(function(k){return [k,KNAME[k]||k,g[k][0],g[k][1]]})}}}
    ],
    interactions: [
      {name:"各知识点正确率", sql:"SELECT knowledge_id, COUNT(*) AS 答题数, ROUND(AVG(correct),3) AS 正确率\nFROM interactions GROUP BY knowledge_id;",
       run:function(){var g={};tables.interactions.rows.forEach(function(r){(g[r.knowledge_id]=g[r.knowledge_id]||[]).push(r)});
         return {cols:["knowledge_id","知识点","答题数","正确率"],rows:Object.keys(g).map(function(k){var a=g[k];return [k,KNAME[k]||k,a.length,(a.reduce(function(s,r){return s+r.correct},0)/a.length).toFixed(3)]})}}},
      {name:"最近 10 条答题记录", sql:"SELECT id, student_id, question_id, correct, answered_at, duration_sec\nFROM interactions ORDER BY id DESC LIMIT 10;",
       run:function(){return {cols:["id","student_id","question_id","correct","answered_at","duration_sec"],rows:tables.interactions.rows.slice().sort(function(a,b){return b.id-a.id}).slice(0,10).map(function(r){return [r.id,r.student_id,r.question_id,r.correct,r.answered_at,r.duration_sec]})}}},
      {name:"答错次数最多的题", sql:"SELECT question_id, COUNT(*) AS 错误次数\nFROM interactions WHERE correct = 0 GROUP BY question_id ORDER BY 错误次数 DESC;",
       run:function(){var g={};tables.interactions.rows.filter(function(r){return !r.correct}).forEach(function(r){g[r.question_id]=(g[r.question_id]||0)+1});
         return {cols:["question_id","错误次数"],rows:Object.keys(g).map(function(k){return [k,g[k]]}).sort(function(a,b){return b[1]-a[1]})}}},
      {name:"平均答题时长", sql:"SELECT student_id, COUNT(*) AS 次数, ROUND(AVG(duration_sec),1) AS 平均秒\nFROM interactions GROUP BY student_id;",
       run:function(){var g={};tables.interactions.rows.forEach(function(r){(g[r.student_id]=g[r.student_id]||[]).push(r.duration_sec)});
         return {cols:["student_id","次数","平均秒"],rows:Object.keys(g).map(function(k){var a=g[k];return [k,a.length,(a.reduce(function(s,v){return s+v},0)/a.length).toFixed(1)]})}}}
    ]
  };

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function hl(s){var q=document.getElementById("q").value.trim();s=esc(s);if(!q)return s;
    try{return s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")}catch(e){return s}}

  function fmtChoice(v){try{var a=JSON.parse(v);return a.map(esc).join(" ｜ ")}catch(e){return esc(v)}}

  // 每列的渲染策略
  function cell(col,val){
    if(col==="choices") return '<td class="mono">'+fmtChoice(val)+'</td>';
    if(col==="correct") return '<td>'+(val?'<span class="pill ok">✓ 正确</span>':'<span class="pill bad">✗ 错误</span>')+'</td>';
    if(col==="knowledge_id") return '<td><span class="pill k">'+hl(val)+'</span></td>';
    if(col==="difficulty") return '<td class="mono"><span class="diff-bar"><i style="width:'+Math.round(val*100)+'%"></i></span>'+Number(val).toFixed(2)+'</td>';
    if(col==="answer"||col==="id"||col==="question_id"||col==="student_id"||col==="source_id"||col==="target_id"||col==="duration_sec"||col==="ordinal"||col==="daily_goal"||col==="relation") return '<td class="mono">'+hl(val)+'</td>';
    return '<td>'+hl(val)+'</td>';
  }

  function renderTabs(){
    var el=document.getElementById("tabs");el.innerHTML="";
    Object.keys(tables).forEach(function(t){
      var b=document.createElement("button");b.className="db-tab"+(t===current?" active":"");
      b.innerHTML='<span>▤</span>'+t+'<span class="cnt">'+tables[t].rows.length+' 行</span>';
      b.onclick=function(){current=t;preset=null;filterK=filterC=filterS="";initFilters();render()};
      el.appendChild(b);
    });
  }

  function initFilters(){
    var fk=document.getElementById("f-knowledge"),fc=document.getElementById("f-correct"),fs=document.getElementById("f-student");
    var cols=tables[current].columns;
    fk.hidden=cols.indexOf("knowledge_id")<0;fc.hidden=cols.indexOf("correct")<0;fs.hidden=cols.indexOf("student_id")<0;
    fk.innerHTML='<option value="">全部知识点</option>'+Object.keys(KNAME).map(function(k){return '<option value="'+k+'">'+KNAME[k]+'</option>'}).join("");
    fc.innerHTML='<option value="">全部结果</option><option value="1">仅正确</option><option value="0">仅错误</option>';
    var sts={};tables[current].rows.forEach(function(r){if(r.student_id)sts[r.student_id]=1});
    fs.innerHTML='<option value="">全部学习者</option>'+Object.keys(sts).map(function(s){return '<option value="'+s+'">'+s+'</option>'}).join("");
    fk.value=filterK;fc.value=filterC;fs.value=filterS;
  }

  function currentRows(){
    var q=document.getElementById("q").value.trim().toLowerCase();
    return tables[current].rows.filter(function(r){
      if(filterK&&r.knowledge_id!==filterK)return false;
      if(filterC&&String(r.correct)!==filterC)return false;
      if(filterS&&r.student_id!==filterS)return false;
      if(q){var hit=false;for(var k in r){if(String(r[k]).toLowerCase().indexOf(q)>=0){hit=true;break}}if(!hit)return false}
      return true;
    });
  }

  function render(){
    var cols=tables[current].columns;
    document.getElementById("schema-note").innerHTML="<b>"+current+"</b>("+cols.map(esc).join(", ")+") — "+tables[current].rows.length+" 行";
    var chips=document.getElementById("sql-chips"),box=document.getElementById("sql-box");
    var qs=QUERIES[current];
    chips.hidden=box.hidden=!qs;
    if(qs){
      chips.innerHTML=qs.map(function(q,i){return '<button class="sql-chip'+(preset===i?" active":"")+'" data-i="'+i+'">▸ '+q.name+'</button>'}).join("");
      Array.prototype.forEach.call(chips.children,function(b){b.onclick=function(){preset=+b.dataset.i;render()}});
      if(preset!=null){
        var r=qs[preset].run();
        document.getElementById("sql-text").innerHTML=esc(qs[preset].sql);
        box.hidden=false;
        document.getElementById("thead").innerHTML="<tr>"+r.cols.map(function(c){return "<th>"+esc(c)+"</th>"}).join("")+"</tr>";
        document.getElementById("tbody").innerHTML=r.rows.map(function(row){return "<tr>"+row.map(function(v,i){return cell(r.cols[i],v)}).join("")+"</tr>"}).join("");
        document.getElementById("row-info").innerHTML="查询「"+qs[preset].name+"」：返回 "+r.rows.length+" 行";
        return;
      }
    }
    var rows=currentRows();
    document.getElementById("thead").innerHTML="<tr>"+cols.map(function(c){return "<th>"+esc(c)+"</th>"}).join("")+"</tr>";
    document.getElementById("tbody").innerHTML=rows.map(function(r){return "<tr>"+cols.map(function(c){return cell(c,r[c])}).join("")+"</tr>"}).join("");
    document.getElementById("row-info").innerHTML=rows.length+" / "+tables[current].rows.length+" 行"+(rows.length<tables[current].rows.length?"（已过滤）":"");
  }

  document.getElementById("q").addEventListener("input",function(){preset=null;render()});
  document.getElementById("f-knowledge").addEventListener("change",function(e){filterK=e.target.value;preset=null;render()});
  document.getElementById("f-correct").addEventListener("change",function(e){filterC=e.target.value;preset=null;render()});
  document.getElementById("f-student").addEventListener("change",function(e){filterS=e.target.value;preset=null;render()});
  document.getElementById("export-btn").onclick=function(){
    var rows=preset!=null&&QUERIES[current]?[]:currentRows();
    var csv;
    if(preset!=null&&QUERIES[current]){var r=QUERIES[current][preset].run();
      csv=[r.cols.join(",")].concat(r.rows.map(function(x){return x.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")})).join("\n");
    }else{var cols=tables[current].columns;
      csv=[cols.join(",")].concat(rows.map(function(r){return cols.map(function(c){return '"'+String(r[c]==null?"":r[c]).replace(/"/g,'""')+'"'}).join(",")})).join("\n");
    }
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));
    a.download=current+(preset!=null?"_query":"")+".csv";a.click();
  };

  renderTabs();initFilters();render();
})();
</script>
</body>
</html>
